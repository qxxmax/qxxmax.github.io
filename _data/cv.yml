    Publications:
      - title: Stochastic Path Sampler For Lattice Field Theory
        authors:
          - Shiyang Chen
          - Moxian Qian
          - Gert Aarts
          - Biagio Lucini
          - Kai Zhou
        publisher: arXiv
        releaseDate: 2026-06
        url: https://arxiv.org/abs/2606.13790
        summary: '<span class="en">Data-free neural sampler based on nonequilibrium thermodynamics and stochastic quantization; matches HMC quality with much shorter autocorrelation in the pseudocritical region of 2D phi^4. Co-first author with S. Chen.</span><span class="zh">基于非平衡热力学与随机量子化的数据无关神经采样器；在 2D φ⁴ 伪临界区，质量与 HMC 相当，自相关时间显著更短。与 S. Chen 共同一作。</span>'

      - title: Operator Spectroscopy of Trained Lattice Samplers
        authors:
          - Moxian Qian
        publisher: arXiv
        releaseDate: 2026-05
        url: https://arxiv.org/abs/2605.11199
        summary: '<span class="en">Operator-spectroscopy framework that probes what neural samplers (flow / diffusion / autoregressive) actually learn about lattice field theories.</span><span class="zh">用算符谱学的框架去探测神经采样器（flow / diffusion / 自回归）究竟学到了什么样的格点场论结构。</span>'

      - title: Variational Autoregressive Networks Applied to $\phi^4$ Field Theory Systems
        authors:
          - Moxian Qian
          - Shiyang Chen
        publisher: arXiv
        releaseDate: 2025-12
        url: https://arxiv.org/abs/2512.19575
        summary: '<span class="en">RL-style data-free training of variational autoregressive networks for the Ising model and 2D phi^4; single-site and block Metropolis-Hastings corrections reduce residual bias of pure VAN sampling.</span><span class="zh">用强化学习方式数据无关地训练变分自回归网络，应用于 Ising 模型与 2D φ⁴；单点 / 块 Metropolis-Hastings 修正显著降低纯 VAN 采样的剩余偏差。</span>'

      - title: Gravitation induced shrinkage of Mercury's orbit
        authors:
          - Moxian Qian
          - Xibin Li
          - Yongjun Cao
        publisher: Chinese Physics B 29 (2020) 109501
        releaseDate: 2020-10
        url: https://doi.org/10.1088/1674-1056/ab9f24
        summary: '<span class="en">General-relativistic gravitational contribution to the secular shrinkage of Mercury''s orbit.</span><span class="zh">水星轨道长期收缩的广义相对论引力修正贡献。</span>'

